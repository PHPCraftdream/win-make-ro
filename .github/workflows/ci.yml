name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      # The COM tests load a built DLL, so the release profile needs its own run.
      - run: cargo test --workspace --release --locked

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The three published versions must agree
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_version=$(node -p "require('./npm/package.json').version")
          scoop_version=$(node -p "require('./bucket/win-make-ro.json').version")
          echo "cargo=$cargo_version npm=$npm_version scoop=$scoop_version"
          test "$cargo_version" = "$npm_version"
          test "$cargo_version" = "$scoop_version"
      - name: The npm scripts must parse
        run: |
          for f in npm/bin/*.js npm/scripts/*.js npm/test/*.js; do node --check "$f"; done
      - name: The npm packaging contract must hold
        run: node npm/test/lifecycle.test.js
      - name: The workflows must be valid
        uses: raven-actions/actionlint@v2
      - name: The PowerShell in the workflows must parse
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import pathlib, yaml
          out = pathlib.Path("/tmp/ps"); out.mkdir(exist_ok=True)
          for wf in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              doc = yaml.safe_load(wf.read_text())
              for job in doc["jobs"].values():
                  shell = job.get("defaults", {}).get("run", {}).get("shell")
                  for i, step in enumerate(job.get("steps", [])):
                      if "run" in step and step.get("shell", shell) == "pwsh":
                          (out / f"{wf.stem}-{job.get('name', 'job')}-{i}.ps1").write_text(step["run"])
          EOF
          for f in /tmp/ps/*.ps1; do
            [ -e "$f" ] || continue
            pwsh -NoProfile -Command "
              \$e = \$null
              [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e) | Out-Null
              if (\$e.Count -gt 0) { \$e | ForEach-Object { Write-Error \$_.Message }; exit 1 }
              Write-Host 'parse ok: $f'"
          done

  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check --workspace --all-targets --locked
