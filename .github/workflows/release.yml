name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  # npm's trusted publishing: the registry is told, by GitHub, which repository
  # and workflow is asking, and decides from that whether to accept. Nothing
  # secret is stored anywhere. It also lets npm attach provenance to the
  # package, which is what lets anyone check the build it came from.
  id-token: write

# Every step below is idempotent: a run that failed halfway can simply be
# repeated, and one that already did its part reports so and moves on.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Stage the package
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          $version = $tag.TrimStart('v')
          $manifest = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'win-make-ro' }
          if ($manifest.version -ne $version) {
            throw "tag $tag does not match Cargo.toml version $($manifest.version)"
          }
          $name = "win-make-ro-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/win-make-ro.exe "dist/$name/"
          Copy-Item target/release/ro_shellext.dll "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          # A zip records each entry's timestamp, so rebuilding the same bytes
          # at a different moment yields a different archive and a different
          # hash. Pinning the stamps to the tagged commit keeps the archive
          # reproducible and verifiable.
          $stamp = [datetime]::Parse((git log -1 --format=%cI)).ToUniversalTime()
          Get-ChildItem "dist/$name" | ForEach-Object { $_.LastWriteTimeUtc = $stamp }
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          "TAG=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "ARCHIVE=dist/$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "SHA256=$hash" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Publish the release
        shell: pwsh
        run: |
          $notes = @"
          SHA-256 of the archive: $env:SHA256

          Install with Scoop:

              scoop bucket add win-make-ro https://github.com/$env:GITHUB_REPOSITORY
              scoop install win-make-ro

          Install with npm:

              npm install -g win-make-ro

          Either one registers the Explorer context menu for the current user.
          npm cannot run scripts on uninstall, so remove the registration with
          ``win-make-ro uninstall`` before ``npm uninstall -g win-make-ro``.
          "@
          # A failing native command does not stop a PowerShell script, and the
          # steps that follow would publish against an archive that never
          # arrived, so every gh call is checked.
          function Assert-Ok([string]$What) {
            if ($LASTEXITCODE -ne 0) { throw "$What failed with exit code $LASTEXITCODE" }
          }
          $assetName = Split-Path $env:ARCHIVE -Leaf
          $sumName = "$assetName.sha256"
          $existing = gh release view $env:TAG --json assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $published = @()
          if ($releaseExists) {
            $published = @(($existing | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          }
          # What to upload, and what to leave alone, is decided by a script of its
          # own so the reruns it has to survive can be tested: see .github/scripts.
          $plan = & .github/scripts/plan-release-assets.ps1 `
            -ArchiveName $assetName -PublishedAssets $published `
            -ReleaseExists:$releaseExists
          if ($plan.Action -eq 'create') {
            gh release create $env:TAG $env:ARCHIVE "$env:ARCHIVE.sha256" `
              --title $env:TAG --notes $notes
            Assert-Ok "creating release $env:TAG"
            exit 0
          }
          if ($plan.Action -eq 'upload') {
            Write-Host "release $env:TAG has no archive; uploading this build"
            gh release upload $env:TAG $env:ARCHIVE "$env:ARCHIVE.sha256" --clobber
            Assert-Ok "uploading the archive to $env:TAG"
            exit 0
          }
          # Reuse: replacing a published archive would invalidate every manifest and
          # release note that already quotes its hash, so the published bytes win and
          # the rest of the run follows their checksum.
          New-Item -ItemType Directory -Path dist/published -Force | Out-Null
          gh release download $env:TAG --pattern $assetName --dir dist/published --clobber
          Assert-Ok "downloading $assetName from $env:TAG"
          $hash = (Get-FileHash "dist/published/$assetName" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SHA256) {
            Write-Host "this build differs from the published archive; keeping the published one"
          }
          # An earlier run may have uploaded the archive and then failed before the
          # checksum; that file is rebuilt from the published archive, not this build.
          if ($plan.RestoreChecksum) {
            Write-Host "the checksum file is missing; restoring it from the published archive"
            "$hash  $assetName" | Out-File -Encoding ascii "dist/published/$sumName"
            gh release upload $env:TAG "dist/published/$sumName" --clobber
            Assert-Ok "uploading $sumName to $env:TAG"
          }
          Write-Host "reusing the archive already on release $env:TAG ($hash)"
          "SHA256=$hash" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      # Before the branch switch below, so the package is published from the
      # tagged tree rather than from whatever the default branch holds now.
      # Trusted publishing needs a package that already exists on the registry
      # to attach its policy to, so a name's first publish has no OIDC config
      # to satisfy and has to go through a token instead. Switch back to the
      # id-token step once win-make-ro has published at least once.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        shell: pwsh
        working-directory: npm
        run: |
          $published = npm view "win-make-ro@$env:VERSION" version 2>$null
          if ($published) {
            Write-Host "win-make-ro@$env:VERSION is already on the registry; skipping"
            exit 0
          }
          Copy-Item ../target/release/win-make-ro.exe vendor/
          Copy-Item ../target/release/ro_shellext.dll vendor/
          Copy-Item ../README.md, ../LICENSE-MIT, ../LICENSE-APACHE .
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:VERSION) {
            throw "npm/package.json is at $($pkg.version), the tag says $env:VERSION"
          }
          "//registry.npmjs.org/:_authToken=$env:NPM_TOKEN" | Out-File -Encoding ascii .npmrc
          try { npm publish --access public } finally { Remove-Item .npmrc -ErrorAction Ignore }
          # The cleanup above would otherwise become the step's exit code and
          # hide a failed publish.
          if ($LASTEXITCODE -ne 0) { throw "npm publish failed with exit code $LASTEXITCODE" }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The checkout above is a detached tag. Committing the manifest there and
      # pushing to the default branch is rejected the moment that branch has
      # moved on, so the edit is made on top of the branch as it is right now.
      # Runs even when the npm publish above failed. The two are separate
      # places to get the same build from, and a registry that refuses - a
      # name held for twenty-four hours after an unpublish, say - is no reason
      # to leave the Scoop manifest pointing at a checksum of zeroes. The job
      # still reports the npm failure.
      - name: Point the Scoop manifest at the new release
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $branch = if ($env:DEFAULT_BRANCH) { $env:DEFAULT_BRANCH } else { "main" }
          $path = "bucket/win-make-ro.json"
          $name = "win-make-ro-$env:VERSION-x86_64-pc-windows-msvc.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$name"
          foreach ($attempt in 1..3) {
            git fetch --quiet origin $branch
            if ($LASTEXITCODE -ne 0) { throw "fetching $branch failed" }
            git checkout --quiet -B $branch "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "checking out $branch failed" }
            # The downgrade guard, and the SemVer comparison it needs, live in a
            # script of their own with tests: see .github/scripts.
            & .github/scripts/update-scoop-manifest.ps1 `
              -Path $path -Version $env:VERSION -Url $url -Hash $env:SHA256 | Out-Null
            git add $path
            if ($LASTEXITCODE -ne 0) { throw "staging $path failed" }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              # Either the manifest already says this, or the guard refused to move
              # it backwards; both leave the file untouched.
              Write-Host "nothing to commit for the manifest"
              exit 0
            }
            git commit --quiet -m "scoop: point the manifest at v$env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw "committing the manifest failed" }
            git push origin $branch
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push rejected, attempt $attempt; rebuilding on the new tip"
            git reset --hard "origin/$branch"
          }
          throw "could not update the Scoop manifest on $branch"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
